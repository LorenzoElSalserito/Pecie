name: Build Release

on:
  workflow_dispatch:
  push:
    branches: ['main', 'master']
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run generate:types
      - run: npm run verify:packaging
      - run: npm run test:packaging
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build

  package:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: linux
            setup_script: 'sudo apt-get update && sudo apt-get install --yes fakeroot alien rpm binutils'
            artifact_paths: |
              build/desktop/forge/make/**/*.deb
              build/desktop/forge/make/**/*.rpm
              build/desktop/appimage/*.AppImage
          - os: windows-latest
            artifact_name: windows
            setup_script: ''
            artifact_paths: build/desktop/windows/*.exe
          - os: macos-latest
            artifact_name: macos
            setup_script: ''
            artifact_paths: |
              build/desktop/forge/make/**/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run generate:types
      - run: npm run verify:packaging
      - if: matrix.setup_script != ''
        run: ${{ matrix.setup_script }}
      - run: npm run dist -w @pecie/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: pecie-${{ matrix.artifact_name }}
          retention-days: 14
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: pecie-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-artifacts/**/*
